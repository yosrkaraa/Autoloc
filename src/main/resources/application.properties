spring.application.name=autoloc

spring.datasource.url=jdbc:postgresql://localhost:5432/autoloc_db
spring.datasource.username=${AUTOLOC_DB_USERNAME:postgres}
spring.datasource.password=${AUTOLOC_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.esprit.tn.autoloc=INFO
