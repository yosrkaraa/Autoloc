spring.application.name=autoloc

spring.datasource.url=jdbc:mysql://${AUTOLOC_DB_HOST:127.0.0.1}:${AUTOLOC_DB_PORT:3306}/autoloc_atelier2
spring.datasource.username=${AUTOLOC_DB_USERNAME:root}
spring.datasource.password=${AUTOLOC_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.esprit.tn.autoloc=INFO
